name: CI

on:
  pull_request:
    branches:
      - main
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENMONTAGE_ALLOW_NETWORK: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: remotion-composer/package-lock.json

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: make install-dev

      - name: Install locked composer and browser
        run: |
          npm --prefix remotion-composer ci
          .venv/bin/python -m playwright install --with-deps chromium

      - name: Compile all Python sources
        run: make lint

      - name: Type-check composer
        run: npm --prefix remotion-composer test

      - name: Run automated tests
        run: .venv/bin/python -m pytest tests/ -q --junitxml=test-results/pytest.xml

      - name: Run isolated local media diagnostics
        run: make test-qa

      - name: Audit production dependencies
        run: make audit

      - name: Retain regression results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-results
          path: test-results/
          if-no-files-found: ignore
