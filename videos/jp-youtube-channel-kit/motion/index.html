<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {
      "id": "language",
      "type": "enum",
      "label": "Language",
      "default": "es",
      "options": [
        { "value": "es", "label": "Español" },
        { "value": "en", "label": "English" }
      ]
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>JP YouTube Micro Intro</title>
    <link rel="stylesheet" href="./assets/kit.css" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      body {
        background: var(--navy);
      }

      #jp-micro-intro {
        background: var(--navy);
        color: var(--ice);
      }

      #mi-orbit-a {
        top: -430px;
        right: -210px;
        width: 980px;
        height: 980px;
      }

      #mi-orbit-b {
        right: 180px;
        bottom: -570px;
        width: 760px;
        height: 760px;
        border-color: rgba(196, 163, 90, 0.22);
      }

      #mi-rule {
        position: absolute;
        top: 160px;
        left: 126px;
        width: 8px;
        height: 760px;
        background: var(--blue);
        transform-origin: top;
      }

      #mi-jp {
        position: absolute;
        top: 214px;
        left: 184px;
        display: grid;
        width: 174px;
        height: 174px;
        border: 3px solid rgba(243, 249, 255, 0.92);
        border-radius: 34px;
        place-items: center;
        font-size: 78px;
        font-weight: 900;
        letter-spacing: -0.08em;
      }

      #mi-copy {
        position: absolute;
        top: 468px;
        left: 184px;
      }

      #mi-copy .micro-label {
        margin-bottom: 28px;
        color: var(--gold);
      }

      #mi-title {
        margin: 0;
        font-size: 132px;
        font-weight: 900;
        letter-spacing: -0.065em;
        line-height: 1;
        text-transform: uppercase;
      }

      #mi-title span {
        display: block;
      }

      #mi-name {
        position: absolute;
        right: 126px;
        bottom: 68px;
        color: rgba(243, 249, 255, 0.72);
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="jp-micro-intro"
      class="stage"
      data-composition-id="jp-micro-intro"
      data-width="1920"
      data-height="1080"
      data-duration="3"
      data-start="0"
    >
      <audio
        id="mi-sonic-signature"
        src="./assets/jp-sonic-signature.wav"
        data-start="0"
        data-duration="2.5"
        data-track-index="10"
        data-volume="0.82"
      ></audio>
      <div id="mi-orbit-a" class="orbit" data-layout-allow-overflow></div>
      <div id="mi-orbit-b" class="orbit" data-layout-allow-overflow></div>
      <div id="mi-rule"></div>
      <div id="mi-jp">JP</div>
      <div id="mi-copy">
        <div id="mi-label" class="micro-label">CANAL / 01</div>
        <h1 id="mi-title">
          <span id="mi-line-1">IA en</span>
          <span id="mi-line-2" class="accent">producción.</span>
        </h1>
      </div>
      <div id="mi-name">JUAN PEDRO MÁRQUEZ</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const { language = "es" } = window.__hyperframes?.getVariables?.() || {};
      const copy = {
        es: { label: "CANAL / 01", line1: "IA en", line2: "producción." },
        en: { label: "CHANNEL / 01", line1: "AI in", line2: "production." },
      }[language];
      document.documentElement.lang = language;
      document.querySelector("#mi-label").textContent = copy.label;
      document.querySelector("#mi-line-1").textContent = copy.line1;
      document.querySelector("#mi-line-2").textContent = copy.line2;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mi-rule", { scaleY: 0 }, { scaleY: 1, duration: 0.5, ease: "expo.out" }, 0.08)
        .fromTo("#mi-jp", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.48, ease: "power4.out" }, 0.2)
        .fromTo("#mi-label", { x: -62, opacity: 0 }, { x: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, 0.42)
        .fromTo("#mi-line-1", { y: 78, opacity: 0 }, { y: 0, opacity: 1, duration: 0.52, ease: "power4.out" }, 0.54)
        .fromTo("#mi-line-2", { x: 110, opacity: 0 }, { x: 0, opacity: 1, duration: 0.58, ease: "circ.out" }, 0.7)
        .fromTo("#mi-orbit-a", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.5, ease: "sine.out" }, 0.08)
        .fromTo("#mi-orbit-b", { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.7, ease: "sine.out" }, 0.18)
        .fromTo("#mi-name", { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.42, ease: "power2.out" }, 1.2);
      tl.seek(0);
      window.__timelines["jp-micro-intro"] = tl;
    </script>
  </body>
</html>
