<!doctype html>
<html
  lang="es"
  data-composition-variables='[
    {
      "id": "language",
      "type": "enum",
      "label": "Language",
      "default": "es",
      "options": [
        { "value": "es", "label": "Español" },
        { "value": "en", "label": "English" }
      ]
    }
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>JP Lower Third</title>
    <link rel="stylesheet" href="assets/kit.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      html,
      body {
        background: transparent;
      }

      #jp-lower-third {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
      }

      #lt-shell {
        position: absolute;
        bottom: 104px;
        left: 104px;
        display: grid;
        width: 820px;
        min-height: 180px;
        grid-template-columns: 14px 1fr;
        overflow: hidden;
        border-radius: 26px;
        background: rgba(10, 22, 40, 0.96);
        box-shadow: 0 22px 58px rgba(0, 0, 0, 0.24);
      }

      #lt-accent {
        background: var(--blue);
        transform-origin: bottom;
      }

      #lt-copy {
        padding: 34px 42px 32px;
        color: var(--ice);
      }

      #lt-kicker {
        margin-bottom: 9px;
        color: var(--gold);
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      #lt-name {
        display: block;
        font-size: 42px;
        font-weight: 900;
        letter-spacing: -0.025em;
      }

      #lt-role {
        display: block;
        margin-top: 8px;
        color: #c9d9ea;
        font-size: 22px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div
      id="jp-lower-third"
      data-composition-id="jp-lower-third"
      data-width="1920"
      data-height="1080"
      data-duration="6"
      data-start="0"
    >
      <div id="lt-shell">
        <div id="lt-accent"></div>
        <div id="lt-copy">
          <div id="lt-kicker">IA EN PRODUCCIÓN</div>
          <strong id="lt-name">Juan Pedro Márquez</strong>
          <span id="lt-role">Arquitectura de IA · Gobernanza · ROI</span>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const { language = "es" } = window.__hyperframes?.getVariables?.() || {};
      const copy = {
        es: { kicker: "IA EN PRODUCCIÓN", role: "Arquitectura de IA · Gobernanza · ROI" },
        en: { kicker: "AI IN PRODUCTION", role: "AI Architecture · Governance · ROI" },
      }[language];
      document.documentElement.lang = language;
      document.querySelector("#lt-kicker").textContent = copy.kicker;
      document.querySelector("#lt-role").textContent = copy.role;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lt-shell", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.62, ease: "power4.out" }, 0.18)
        .fromTo("#lt-accent", { scaleY: 0 }, { scaleY: 1, duration: 0.42, ease: "expo.out" }, 0.42)
        .fromTo("#lt-copy > *", { x: -34, opacity: 0 }, { x: 0, opacity: 1, duration: 0.34, stagger: 0.08, ease: "power3.out" }, 0.48)
        .to("#lt-shell", { x: -80, opacity: 0, duration: 0.56, ease: "power3.in" }, 5.2);
      tl.seek(0);
      window.__timelines["jp-lower-third"] = tl;
    </script>
  </body>
</html>
