<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Slides · VID-001</title>
  <style>
    :root { --navy:#0a1628; --navy2:#10223d; --azure:#4a90e2; --gold:#c4a35a; --ink:#f6f8fc; --muted:#a9b8cc; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:#02070e; font-family:Inter, system-ui, sans-serif; }
    .deck { width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; position:relative; background:var(--navy); overflow:hidden; }
    .slide {
      position:absolute; inset:0; display:none; padding:6.3% 7%; isolation:isolate;
      background:
        radial-gradient(circle at 87% 10%, rgba(74,144,226,.25), transparent 29%),
        linear-gradient(135deg, var(--navy), #07111f 72%);
    }
    .slide.active { display:grid; grid-template-columns:1.05fr .95fr; gap:5%; align-items:center; }
    .slide::before { content:""; position:absolute; inset:0 auto 0 0; width:9px; background:linear-gradient(var(--gold),var(--azure)); }
    .eyebrow { color:var(--gold); font:700 clamp(10px,1vw,19px) "Space Mono", monospace; letter-spacing:.18em; text-transform:uppercase; }
    h1 { max-width:880px; margin:22px 0; font-family:Satoshi, Inter, sans-serif; font-size:clamp(34px,4.6vw,88px); line-height:.98; letter-spacing:-.045em; }
    p { max-width:800px; color:var(--muted); font-size:clamp(17px,1.65vw,32px); line-height:1.35; }
    .visual { min-height:68%; display:grid; place-items:center; position:relative; }
    .badge { position:absolute; right:4%; bottom:4%; color:#7790b1; font:700 clamp(8px,.7vw,13px) monospace; }
    .number { font-size:clamp(120px,19vw,360px); font-weight:900; line-height:.72; color:rgba(74,144,226,.12); letter-spacing:-.1em; }
    .door { width:50%; height:78%; border:5px solid var(--azure); border-bottom:0; position:relative; box-shadow:0 30px 80px rgba(0,0,0,.26); }
    .door::after { content:"PROD"; position:absolute; inset:48% auto auto 50%; transform:translate(-50%,-50%); color:var(--gold); font:800 clamp(14px,1.5vw,28px) monospace; }
    .lights { position:absolute; right:-42px; top:8%; display:grid; gap:18px; }
    .lights i { width:25px; height:25px; border-radius:50%; background:#59c99a; border:3px solid rgba(255,255,255,.24); }
    .lights i:last-child { background:#f07474; }
    .control-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; width:100%; }
    .control-grid div { padding:22px; border:1px solid rgba(255,255,255,.12); border-radius:15px; background:rgba(255,255,255,.045); font-size:clamp(15px,1.35vw,26px); }
    .control-grid div:last-child { grid-column:1/-1; border-color:rgba(196,163,90,.5); }
    .pipeline { width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap:8%; align-items:center; }
    .pipeline div { min-height:150px; display:grid; place-items:center; border:2px solid var(--azure); border-radius:20px; font-size:clamp(22px,2.1vw,42px); font-weight:900; position:relative; }
    .pipeline div:not(:last-child)::after { content:"→"; position:absolute; right:-27%; color:var(--gold); }
    .traffic { display:grid; gap:22px; width:60%; padding:34px; border:1px solid rgba(255,255,255,.15); border-radius:30px; }
    .traffic div { padding:18px; border-radius:12px; font-weight:800; color:#07111f; text-align:center; }
    .traffic div:nth-child(1){background:#59c99a}.traffic div:nth-child(2){background:#f2bd62}.traffic div:nth-child(3){background:#f07474}
    .identity { width:100%; display:grid; grid-template-columns:repeat(2,1fr); gap:20px; }
    .identity div { display:grid; place-items:center; min-height:135px; border-radius:50%; border:2px solid var(--azure); font-size:clamp(16px,1.4vw,27px); text-align:center; }
    .matrix { width:100%; display:grid; grid-template-columns:repeat(3,1fr); border:1px solid rgba(255,255,255,.16); }
    .matrix div { min-height:100px; padding:14px; display:grid; place-items:center; text-align:center; border:1px solid rgba(255,255,255,.09); color:var(--muted); }
    .matrix .head { color:white; font-weight:800; background:rgba(74,144,226,.12); }
    .score { width:100%; display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
    .score div { min-height:160px; display:grid; place-items:center; text-align:center; padding:12px; border-radius:14px; border:1px solid rgba(89,201,154,.55); color:#d8f6e9; }
    .score div::before { content:"✓"; display:block; color:#59c99a; font-size:50px; }
    .document { width:62%; aspect-ratio:3/4; padding:11%; background:#f8fafc; color:var(--navy); border-top:10px solid var(--gold); box-shadow:0 30px 90px rgba(0,0,0,.38); transform:rotate(3deg); }
    .document strong { display:block; font-size:clamp(18px,2vw,38px); line-height:1.04; }
    .document span { display:block; margin-top:22px; color:#526178; font-size:clamp(12px,1.1vw,20px); }
    .controls { position:fixed; z-index:5; bottom:16px; left:50%; transform:translateX(-50%); display:flex; gap:8px; opacity:.25; transition:.2s; }
    .controls:hover { opacity:1; }
    button { padding:9px 13px; color:white; background:rgba(9,22,40,.9); border:1px solid rgba(255,255,255,.18); border-radius:9px; cursor:pointer; }
    .notes { position:fixed; inset:12px 12px auto auto; z-index:6; width:min(430px,45vw); padding:12px; color:#dbe5f3; background:rgba(4,10,18,.92); border:1px solid rgba(255,255,255,.15); border-radius:10px; font-size:12px; display:none; }
    body.show-notes .notes { display:block; }
  </style>
</head>
<body>
  <main class="deck" id="deck"></main>
  <aside class="notes" id="notes"></aside>
  <div class="controls"><button id="prev">←</button><button id="count">1 / 9</button><button id="next">→</button><button id="note">Notas</button><button id="full">Full</button></div>
  <script src="production-data.js"></script>
  <script>
    const slides = window.JP_VIDEO_001.slides;
    const graphics = [
      `<div class="door"><div class="lights"><i></i><i></i><i></i><i></i><i></i></div></div>`,
      `<div class="control-grid"><div>1 · Entorno</div><div>2 · Datos</div><div>3 · Identidad</div><div>4 · Pruebas</div><div>5 · Operación</div></div>`,
      `<div class="pipeline"><div>DEV</div><div>TEST</div><div>PROD</div></div>`,
      `<div class="traffic"><div>PERMITIDO</div><div>RESTRINGIDO</div><div>BLOQUEADO</div></div>`,
      `<div class="identity"><div>USUARIO</div><div>AGENTE</div><div>CONEXIÓN</div><div>SISTEMA</div></div>`,
      `<div class="matrix"><div class="head">OBJETIVO</div><div class="head">ATAQUE</div><div class="head">ESPERADO</div><div>Responder</div><div>Ignorar límites</div><div>Rechazar</div><div>Actuar</div><div>Escalar permiso</div><div>Detener</div></div>`,
      `<div class="pipeline"><div>DESPLEGAR</div><div>OBSERVAR</div><div>REVERTIR</div></div>`,
      `<div class="score"><div>Entorno</div><div>Datos</div><div>Identidad</div><div>Pruebas</div><div>Operación</div></div>`,
      `<div class="document"><strong>Checklist de producción</strong><span>5 controles · Evidencia · Decisión</span></div>`
    ];
    let index = 0;
    const deck = document.getElementById("deck");
    deck.innerHTML = slides.map((s,i)=>`<section class="slide ${i===0?"active":""}"><div><span class="eyebrow">${s.id} · COPILOT STUDIO</span><h1>${s.title}</h1><p>${s.onScreen}</p></div><div class="visual">${graphics[i]}</div><span class="badge">JUAN PEDRO MARQUEZ · ${String(i+1).padStart(2,"0")}</span></section>`).join("");
    function show(next) {
      index = (next + slides.length) % slides.length;
      document.querySelectorAll(".slide").forEach((el,i)=>el.classList.toggle("active",i===index));
      document.getElementById("count").textContent = `${index+1} / ${slides.length}`;
      document.getElementById("notes").innerHTML = `<strong>${slides[index].id}</strong><br>${slides[index].visual}`;
    }
    document.getElementById("prev").onclick=()=>show(index-1);
    document.getElementById("next").onclick=()=>show(index+1);
    document.getElementById("note").onclick=()=>document.body.classList.toggle("show-notes");
    document.getElementById("full").onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    document.addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key)){e.preventDefault();show(index+1)}if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();show(index-1)}if(e.key.toLowerCase()==="n")document.body.classList.toggle("show-notes");if(e.key.toLowerCase()==="f")document.getElementById("full").click()});
    show(0);
  </script>
</body>
</html>
